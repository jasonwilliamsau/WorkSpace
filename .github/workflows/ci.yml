name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - dashboard-app
          - touch-driver
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app
      - name: Test ${{ matrix.package }}
        run: swift test --package-path "${{ matrix.package }}" -Xswiftc -warnings-as-errors
